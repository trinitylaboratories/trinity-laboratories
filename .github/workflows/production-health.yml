name: Production health

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify HTTPS, apex routing, and indexing policy
        run: >-
          node scripts/verify-indexability.mjs
          --url https://trinitylaboratories.org
          --environment production
