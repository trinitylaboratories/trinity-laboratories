name: Production health

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify HTTPS, apex routing, and indexing policy
        run: >-
          node scripts/verify-indexability.mjs
          --url https://trinitylaboratories.org
          --environment production
